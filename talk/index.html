<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Talk to Jarvis</title>
<style>
  :root {
    --idle: #3b82f6;
    --listening: #22d3ee;
    --thinking: #f59e0b;
    --speaking: #a855f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: radial-gradient(ellipse at top, #131826 0%, #0a0c12 60%);
    color: #e6e6e6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6b7280;
    margin: 0 0 40px;
  }
  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #orb-wrap {
    position: relative;
    width: 340px;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #orb-ground {
    position: absolute;
    bottom: 18px;
    width: 150px;
    height: 28px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(59,130,246,0.35), transparent 70%);
    filter: blur(4px);
    transition: background 0.4s;
  }
  canvas#viz {
    position: absolute;
    top: 0;
    left: 0;
    width: 340px;
    height: 340px;
  }
  #orb {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), var(--idle) 70%);
    box-shadow: 0 0 55px 10px var(--idle);
    transition: background 0.4s, box-shadow 0.4s;
    animation: breathe 3.2s ease-in-out infinite;
    cursor: pointer;
  }
  #orb.listening { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), var(--listening) 70%); box-shadow: 0 0 65px 14px var(--listening); animation: breathe 1.4s ease-in-out infinite; }
  #orb.thinking { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.25), var(--thinking) 70%); box-shadow: 0 0 60px 12px var(--thinking); animation: spin-pulse 1s linear infinite; }
  #orb.speaking { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), var(--speaking) 70%); box-shadow: 0 0 70px 16px var(--speaking); animation: breathe 1.8s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  @keyframes spin-pulse {
    0% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.04) rotate(180deg); }
    100% { transform: scale(1) rotate(360deg); }
  }
  #app-status, #auth-status, #reset-status {
    margin-top: 28px;
    font-size: 14px;
    color: #9ca3af;
    min-height: 20px;
    letter-spacing: 0.5px;
  }
  #conversation {
    margin-top: 32px;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
  }
  .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    animation: fade-in 0.3s ease-out;
  }
  .bubble.you { background: #1a1f2b; color: #cbd5e1; align-self: flex-end; }
  .bubble.jarvis { background: #1c2440; color: #e6e6e6; align-self: flex-start; }
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  canvas#starfield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
  }
  #auth-screen {
    width: 100%;
    max-width: 340px;
    display: flex;
    justify-content: center;
    animation: card-in 0.5s ease-out;
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .auth-card {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 36px 30px 30px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(26,32,50,0.7), rgba(15,19,30,0.7));
    border: 1px solid rgba(96,165,250,0.18);
    box-shadow: 0 0 60px -10px rgba(59,130,246,0.25), inset 0 1px 0 rgba(255,255,255,0.04);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .auth-orb {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.3), var(--idle) 75%);
    box-shadow: 0 0 24px 4px rgba(59,130,246,0.5);
    animation: breathe 3.2s ease-in-out infinite;
    margin-bottom: 2px;
  }
  .auth-title { font-size: 16px; font-weight: 600; color: #e6e6e6; letter-spacing: 0.3px; }
  #auth-screen input, #reset-screen input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(10,13,20,0.6);
    color: #e6e6e6;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #auth-screen input::placeholder, #reset-screen input::placeholder { color: #6b7280; }
  #auth-screen input:focus, #reset-screen input:focus {
    outline: none;
    border-color: var(--idle);
    box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
  }
  #auth-screen .auth-buttons { display: flex; gap: 10px; width: 100%; }
  #auth-screen button, #reset-screen button {
    flex: 1;
    padding: 12px 0;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s, opacity 0.2s;
  }
  #auth-screen button:active, #reset-screen button:active { transform: scale(0.97); }
  #sign-in-button {
    border: 1px solid rgba(255,255,255,0.14);
    background: transparent;
    color: #d1d5db;
  }
  #sign-in-button:hover { border-color: #9ca3af; }
  #sign-up-button, #reset-password-button {
    border: none;
    background: linear-gradient(135deg, #3b82f6, #22d3ee);
    color: #0a0c12;
    box-shadow: 0 0 20px -4px rgba(59,130,246,0.6);
  }
  #sign-up-button:hover, #reset-password-button:hover { box-shadow: 0 0 26px -2px rgba(59,130,246,0.8); }
  #auth-error, #reset-error { color: #f87171; font-size: 13px; min-height: 18px; text-align: center; }
  #forgot-password-link {
    background: none;
    border: none;
    color: #6b7280;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  #forgot-password-link:hover { color: #9ca3af; }
  #sign-out {
    position: fixed;
    top: 16px;
    right: 20px;
    background: none;
    border: none;
    color: #6b7280;
    font-size: 12px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #sign-out:hover { color: #9ca3af; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <h1>Jarvis</h1>

  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-orb"></div>
      <div class="auth-title">Welcome to Jarvis</div>
      <div id="auth-status" style="margin-top: 0;">Sign in to talk to your Jarvis</div>
      <input id="auth-email" type="email" placeholder="Email" autocomplete="email" />
      <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
      <div class="auth-buttons">
        <button id="sign-in-button">Sign In</button>
        <button id="sign-up-button">Sign Up</button>
      </div>
      <button id="forgot-password-link" type="button">Forgot password?</button>
      <div id="auth-error"></div>
    </div>
  </div>

  <div id="reset-screen" class="hidden">
    <div class="auth-card">
      <div class="auth-orb"></div>
      <div class="auth-title">Set a new password</div>
      <div id="reset-status" style="margin-top: 0;">Choose a new password for your account</div>
      <input id="reset-password-input" type="password" placeholder="New password" autocomplete="new-password" />
      <button id="reset-password-button">Set password</button>
      <div id="reset-error"></div>
    </div>
  </div>

  <button id="sign-out" class="hidden">Sign out</button>

  <div id="app" class="hidden">
    <div id="orb-wrap">
      <div id="orb-ground"></div>
      <canvas id="viz" width="340" height="340"></canvas>
      <div id="orb"></div>
    </div>
    <div id="app-status">Tap the orb to start</div>
    <div id="conversation"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const API_BASE = "https://jarvis-u539.onrender.com";

    // From your Supabase project's Settings -> API page. The anon key is
    // meant to be public — it can only call the Auth API on your behalf;
    // it does NOT grant access to your data (api.py checks that separately).
    const SUPABASE_URL = "https://jhkwvetmtezkpsxpqexb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impoa3d2ZXRtdGV6a3BzeHBxZXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTM3NDksImV4cCI6MjEwMjIyOTc0OX0.Ljff17iQHspPFMEMTb7lVmpK0fCIKYeZEyQCN9MRhrs";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const SILENCE_THRESHOLD = 20;
    const SILENCE_DURATION_MS = 900;
    const MIN_UTTERANCE_MS = 500;
    const MAX_UTTERANCE_MS = 25000;

    const orb = document.getElementById("orb");
    const status = document.getElementById("app-status");
    const conversation = document.getElementById("conversation");
    const canvas = document.getElementById("viz");
    const canvasCtx = canvas.getContext("2d");

    const authScreen = document.getElementById("auth-screen");
    const authStatus = document.getElementById("auth-status");
    const authEmail = document.getElementById("auth-email");
    const authPassword = document.getElementById("auth-password");
    const authError = document.getElementById("auth-error");
    const signInButton = document.getElementById("sign-in-button");
    const signUpButton = document.getElementById("sign-up-button");
    const signOutButton = document.getElementById("sign-out");
    const appDiv = document.getElementById("app");
    const forgotPasswordLink = document.getElementById("forgot-password-link");
    const resetScreen = document.getElementById("reset-screen");
    const resetPasswordInput = document.getElementById("reset-password-input");
    const resetPasswordButton = document.getElementById("reset-password-button");
    const resetError = document.getElementById("reset-error");

    let audioContext = null;
    let sessionActive = false;
    let analyser = null;
    let animationFrame = null;

    function setState(state) {
      orb.className = state;
    }

    function addBubble(who, text) {
      const div = document.createElement("div");
      div.className = `bubble ${who}`;
      div.textContent = text;
      conversation.prepend(div);
    }

    function drawVisualizer(color) {
      if (!analyser) return;
      const bins = analyser.frequencyBinCount;
      const data = new Uint8Array(bins);
      analyser.getByteFrequencyData(data);

      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const baseRadius = 95;
      const bars = 48;

      canvasCtx.strokeStyle = color;
      canvasCtx.lineWidth = 3;
      canvasCtx.lineCap = "round";

      for (let i = 0; i < bars; i++) {
        const value = data[Math.floor((i / bars) * bins)] || 0;
        const length = 8 + (value / 255) * 50;
        const angle = (i / bars) * Math.PI * 2;
        const x1 = cx + Math.cos(angle) * baseRadius;
        const y1 = cy + Math.sin(angle) * baseRadius;
        const x2 = cx + Math.cos(angle) * (baseRadius + length);
        const y2 = cy + Math.sin(angle) * (baseRadius + length);
        canvasCtx.beginPath();
        canvasCtx.moveTo(x1, y1);
        canvasCtx.lineTo(x2, y2);
        canvasCtx.stroke();
      }

      animationFrame = requestAnimationFrame(() => drawVisualizer(color));
    }

    function stopVisualizer() {
      if (animationFrame) cancelAnimationFrame(animationFrame);
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getVolume(freqData) {
      let sum = 0;
      for (let i = 0; i < freqData.length; i++) sum += freqData[i];
      return sum / freqData.length;
    }

    async function listenForUtterance() {
      setState("listening");
      status.textContent = "Listening...";

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      const source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 128;
      source.connect(analyser);
      drawVisualizer(getComputedStyle(document.documentElement).getPropertyValue("--listening"));

      const chunks = [];
      const mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

      const stopped = new Promise((resolve) => {
        mediaRecorder.onstop = () => resolve();
      });

      mediaRecorder.start();

      const freqData = new Uint8Array(analyser.frequencyBinCount);
      const startTime = Date.now();
      let hasSpoken = false;
      let silenceStart = null;

      await new Promise((resolve) => {
        function check() {
          if (!sessionActive) return resolve();

          analyser.getByteFrequencyData(freqData);
          const volume = getVolume(freqData);
          const elapsed = Date.now() - startTime;

          if (volume > SILENCE_THRESHOLD) {
            hasSpoken = true;
            silenceStart = null;
          } else if (hasSpoken) {
            if (silenceStart === null) silenceStart = Date.now();
            if (Date.now() - silenceStart > SILENCE_DURATION_MS && elapsed > MIN_UTTERANCE_MS) {
              return resolve();
            }
          }

          if (elapsed > MAX_UTTERANCE_MS) return resolve();

          setTimeout(check, 100);
        }
        check();
      });

      mediaRecorder.stop();
      await stopped;
      stream.getTracks().forEach((track) => track.stop());
      stopVisualizer();

      return new Blob(chunks, { type: mediaRecorder.mimeType || "audio/webm" });
    }

    async function sendAndRespond(blob) {
      setState("thinking");
      status.textContent = "Thinking...";

      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        status.textContent = "Signed out — please sign in again.";
        return false;
      }

      const formData = new FormData();
      formData.append("file", blob, "recording.webm");

      let data;
      try {
        const response = await fetch(`${API_BASE}/chat/audio`, {
          method: "POST",
          headers: { Authorization: `Bearer ${session.access_token}` },
          body: formData,
        });
        if (response.status === 401) {
          status.textContent = "Session expired — please sign in again.";
          await sb.auth.signOut();
          return false;
        }
        data = await response.json();
      } catch (err) {
        status.textContent = "Something went wrong — tap to try again.";
        console.error(err);
        return false;
      }

      if (data.transcript) addBubble("you", data.transcript);
      addBubble("jarvis", data.response_text);

      if (data.response_audio_base64) {
        setState("speaking");
        status.textContent = "Jarvis is speaking...";

        const mimeType = data.response_audio_mime_type || "audio/mpeg";
        const audioEl = new Audio(`data:${mimeType};base64,${data.response_audio_base64}`);
        const speakingSource = audioContext.createMediaElementSource(audioEl);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 128;
        speakingSource.connect(analyser);
        analyser.connect(audioContext.destination);

        drawVisualizer(getComputedStyle(document.documentElement).getPropertyValue("--speaking"));

        try {
          await new Promise((resolve, reject) => {
            audioEl.onended = resolve;
            audioEl.onerror = reject;
            audioEl.play().catch(reject);
          });
        } catch (err) {
          console.error("Playback failed:", err);
          status.textContent = "Couldn't play audio — check browser permissions.";
        }
        stopVisualizer();
      }

      return true;
    }

    async function conversationLoop() {
      while (sessionActive) {
        const blob = await listenForUtterance();
        if (!sessionActive) break;
        if (blob.size < 1000) continue;
        const ok = await sendAndRespond(blob);
        if (!ok) break;
      }
      endSession();
    }

    async function startSession() {
      sessionActive = true;
      audioContext = new (window.AudioContext || window.webkitAudioContext)();

      const silentBuffer = audioContext.createBuffer(1, 1, 22050);
      const unlockSource = audioContext.createBufferSource();
      unlockSource.buffer = silentBuffer;
      unlockSource.connect(audioContext.destination);
      unlockSource.start(0);

      conversationLoop();
    }

    function endSession() {
      sessionActive = false;
      stopVisualizer();
      setState("idle");
      status.textContent = "Tap the orb to start";
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }
    }

    function toggleSession() {
      if (sessionActive) {
        endSession();
      } else {
        startSession();
      }
    }

    orb.addEventListener("click", toggleSession);

    function showApp() {
      authScreen.classList.add("hidden");
      resetScreen.classList.add("hidden");
      signOutButton.classList.remove("hidden");
      appDiv.classList.remove("hidden");
    }

    function showAuth() {
      appDiv.classList.add("hidden");
      resetScreen.classList.add("hidden");
      signOutButton.classList.add("hidden");
      authScreen.classList.remove("hidden");
      authError.textContent = "";
      authPassword.value = "";
    }

    function showReset() {
      appDiv.classList.add("hidden");
      authScreen.classList.add("hidden");
      signOutButton.classList.add("hidden");
      resetScreen.classList.remove("hidden");
      resetError.textContent = "";
      resetPasswordInput.value = "";
    }

    signInButton.addEventListener("click", async () => {
      authError.textContent = "";
      const { error } = await sb.auth.signInWithPassword({
        email: authEmail.value.trim(),
        password: authPassword.value,
      });
      if (error) authError.textContent = error.message;
    });

    signUpButton.addEventListener("click", async () => {
      authError.textContent = "";
      const { data, error } = await sb.auth.signUp({
        email: authEmail.value.trim(),
        password: authPassword.value,
      });
      if (error) {
        authError.textContent = error.message;
      } else if (!data.session) {
        authStatus.textContent = "Check your email to confirm your account, then sign in.";
      }
    });

    forgotPasswordLink.addEventListener("click", async () => {
      authError.textContent = "";
      const email = authEmail.value.trim();
      if (!email) {
        authError.textContent = "Enter your email above first, then tap this again.";
        return;
      }
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });
      authError.textContent = error ? error.message : "Check your email for a reset link.";
    });

    resetPasswordButton.addEventListener("click", async () => {
      resetError.textContent = "";
      if (resetPasswordInput.value.length < 6) {
        resetError.textContent = "Password must be at least 6 characters.";
        return;
      }
      const { error } = await sb.auth.updateUser({ password: resetPasswordInput.value });
      if (error) {
        resetError.textContent = error.message;
      } else {
        showApp();
      }
    });

    signOutButton.addEventListener("click", async () => {
      if (sessionActive) endSession();
      await sb.auth.signOut();
    });

    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        showReset();
      } else if (session) {
        showApp();
      } else {
        if (sessionActive) endSession();
        showAuth();
      }
    });

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) showApp();
      else showAuth();
    });

    (function initStarfield() {
      const starCanvas = document.getElementById("starfield");
      const ctx = starCanvas.getContext("2d");
      let stars = [];

      function resize() {
        starCanvas.width = window.innerWidth;
        starCanvas.height = window.innerHeight;
        const count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          radius: Math.random() * 1.4 + 0.3,
          speed: Math.random() * 0.15 + 0.03,
          opacity: Math.random() * 0.5 + 0.15,
        }));
      }

      function draw() {
        ctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
        for (const star of stars) {
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(96, 165, 250, ${star.opacity})`;
          ctx.fill();

          star.y += star.speed;
          if (star.y > starCanvas.height) {
            star.y = 0;
            star.x = Math.random() * starCanvas.width;
          }
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>
